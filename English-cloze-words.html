/* ============ 数据：2篇完形实战 ============ */
var CLOZES=[
{t:"Cloze 1 · 一个「错误」如何变成机会（记叙文）",tip:"每空4个选项均为本专项辨析过的易混词",
text:"When I was in Grade 10, I signed up to be a volunteer at the city library. On my first day, I was asked to arrange the new books. Eager to prove myself, I finished quickly and left an hour early, feeling {{1}}. A week later, the librarian called me in. A whole shelf of books had been placed in the wrong section. 'Didn't you read the labels?' she asked. I wanted to {{2}} that I had, but my face turned red. It was my {{3}}, nobody else's. I expected her to fire me. Instead, she handed me a new list. 'Every single book must be {{4}} checked. I know you can do it properly.' Her trust had an unexpected {{5}} on me: I stopped rushing. Three days later, the job was done. The librarian smiled and said, 'Mistakes are the best teachers.' That summer, I was given more {{6}}—helping children with their reading. I learned that a mistake, once {{7}}, can open doors. The experience was so {{8}} that I still volunteer there every holiday. I have no {{9}} of quitting. The library has become a {{10}} part of my life.",
blanks:[
{o:["alive","lonely","proud","single"],a:"proud",e:"急于证明自己+快速完成→自豪；lonely/single 色彩不合。"},
{o:["admit","declare","announce","claim"],a:"admit",e:"后文羞愧→想「承认」；claim 声称（未必属实）色彩不对。"},
{o:["mistake","error","fault","shortcoming"],a:"fault",e:"It's my fault 固定句型；fault 强调「应负责」。"},
{o:["actually","continuously","previously","careful"],a:"continuously",e:"逐本连续核对；只有 continuously 语法+语义双通。"},
{o:["effect","affect","impact","award"],a:"effect",e:"have an effect on 固定搭配；affect 是动词。"},
{o:["chances","opportunities","occasions","scenes"],a:"opportunities",e:"被给予「难得的」机会；chance 偏碰巧。"},
{o:["ignored","overlooked","admitted","refused"],a:"admitted",e:"错误一旦被承认→与前文呼应；ignore 故意不理破坏逻辑。"},
{o:["beneficial","profitable","favourable","available"],a:"beneficial",e:"经历「有益」；profitable 指赚钱。"},
{o:["intention","purpose","goal","aim"],a:"intention",e:"have no intention of doing 固定搭配。"},
{o:["vital","alive","living","lively"],a:"vital",e:"必不可少的一部分；alive 不能作前置定语。"}
]},
{t:"Cloze 2 · 数字时代的深度阅读（议论文）",tip:"关注上下文逻辑与搭配",
text:"In an age of short videos, deep reading is becoming a rare skill. Some argue that reading long articles is a {{1}} of time, since information can be gained faster from summaries. This view, {{2}}, ignores how the brain actually learns. Reading is not just receiving information; it is a {{3}} between the reader and the text. When we struggle with a difficult paragraph, the effort itself builds understanding. Skipping this process is like {{4}} exercise and expecting to grow stronger. Schools must take {{5}} to protect deep reading. Simply banning phones is not enough; students need to see the {{6}} of slow reading. A student who finishes a long novel gains not only knowledge but also patience and empathy—qualities no summary can {{7}}. Of course, technology itself is not the {{8}} of the problem; rather, it is how we use it. E-books, when used {{9}}, can support deep reading with dictionaries and notes. The real question is whether we can {{10}} the will to focus in a world designed to distract us.",
blanks:[
{o:["waste","cost","price","expense"],a:"waste",e:"a waste of time 固定搭配。"},
{o:["however","therefore","otherwise","moreover"],a:"however",e:"前后转折：有人这么认为，然而……"},
{o:["scene","sign","journey","mark"],a:"journey",e:"比喻：阅读是读者与文本之间的「旅程」。"},
{o:["avoiding","escaping","fleeing","preventing"],a:"avoiding",e:"avoid doing；逃避锻炼的比喻。"},
{o:["measures","means","methods","approaches"],a:"measures",e:"take measures to do 固定搭配。"},
{o:["value","worth","price","cost"],a:"worth",e:"see the worth of… 看到……的价值。"},
{o:["produce","create","contain","hold"],a:"create",e:"概括无法「创造」出耐心与共情。"},
{o:["cause","reason","excuse","result"],a:"cause",e:"the cause of the problem 问题根源。"},
{o:["economically","effectively","efficiently","continuously"],a:"effectively",e:"被「有效」使用；efficiently 偏省时。"},
{o:["keep","resist","exist","quit"],a:"keep",e:"keep the will to focus 保持专注的意志。"}
]}
];

/* ============ 逻辑 ============ */
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;")}
var wrongs=JSON.parse(localStorage.getItem("cloze_wrong")||"[]");
function saveWrongs(){localStorage.setItem("cloze_wrong",JSON.stringify(wrongs));updateWrongBadge();renderWrong();}
function addWrong(q,yours,right,note){
if(wrongs.some(function(w){return w.q===q}))return;
wrongs.push({q:q,yours:yours,right:right,note:note});saveWrongs();
}
function removeWrong(i){wrongs.splice(i,1);saveWrongs();}
function updateWrongBadge(){document.getElementById("wrongCount").textContent=wrongs.length?"("+wrongs.length+")":"";}

/* 导航 */
var tabs=document.querySelectorAll("nav button");
tabs.forEach(function(b){
b.onclick=function(){
tabs.forEach(function(x){x.classList.remove("on")});
b.classList.add("on");
document.querySelectorAll("section").forEach(function(s){s.classList.remove("on")});
document.getElementById(b.dataset.tab).classList.add("on");
if(b.dataset.tab==="wrong")renderWrong();
};
});

/* 学习卡 */
var cat="all",kw="";
function renderGroups(){
var list=GROUPS.filter(function(g){
var okCat=(cat==="all"||g.c===cat);
var okKw=!kw||(g.w+g.n+g.e).toLowerCase().indexOf(kw.toLowerCase())>=0;
return okCat&&okKw;
});
var tagName={v:"动词",n:"名词",a:"形容词"};
var html=list.map(function(g){
return '<div class="card"><h3><span class="tag">'+tagName[g.c]+'</span>'+esc(g.w)+'</h3><p>'+esc(g.n)+'</p><div class="ex">'+esc(g.e)+'</div></div>';
}).join("");
document.getElementById("groups").innerHTML=html||'<div class="empty">没有匹配的词条</div>';
document.getElementById("groupStat").textContent="共 "+list.length+" 组 · 全部 "+GROUPS.length+" 组";
}
document.querySelectorAll("#study .chip").forEach(function(c){
c.onclick=function(){
document.querySelectorAll("#study .chip").forEach(function(x){x.classList.remove("on")});
c.classList.add("on");cat=c.dataset.cat;renderGroups();
};
});
document.getElementById("search").oninput=function(){kw=this.value;renderGroups();};
renderGroups();

/* 选词填空 */
function renderFills(){
document.getElementById("fillWrap").innerHTML=FILLS.map(function(ex,ei){
var bankHtml=ex.bank.map(function(w){return "<span>"+esc(w)+"</span>"}).join("");
var items=ex.items.map(function(it,ii){
var id="f"+ei+"_"+ii;
var opts='<option value="">—选词—</option>'+ex.bank.map(function(w){return '<option value="'+esc(w)+'">'+esc(w)+'</option>'}).join("");
return '<div class="q" id="q_'+id+'"><span class="no">'+(ii+1)+'.</span>'+esc(it.s).replace("___",'<select id="'+id+'">'+opts+'</select>')+'<div class="ans" id="a_'+id+'"></div></div>';
}).join("");
return '<div class="panel"><h2>'+esc(ex.t)+'</h2><div class="tip">'+esc(ex.tip)+' · 点击词库记忆，在下拉框中选词</div><div class="bank">'+bankHtml+'</div>'+items+'<button class="btn" onclick="checkFill('+ei+')">检查答案</button><div class="score" id="fs_'+ei+'"></div></div>';
}).join("");
}
function checkFill(ei){
var ex=FILLS[ei],ok=0,done=0;
ex.items.forEach(function(it,ii){
var id="f"+ei+"_"+ii;
var sel=document.getElementById(id);
var row=document.getElementById("q_"+id);
var ans=document.getElementById("a_"+id);
var v=sel.value;
row.classList.remove("ok","bad");
ans.style.display="none";
if(!v)return;
done++;
if(v===it.a){ok++;row.classList.add("ok");}
else{
row.classList.add("bad");
ans.innerHTML='<b>正确答案：'+esc(it.a)+'</b>　'+esc(it.n);
ans.style.display="block";
addWrong(it.s.replace("___","____"),v,it.a,it.n);
}
});
var s=document.getElementById("fs_"+ei);
s.textContent="得分 "+ok+"/"+ex.items.length+(done<ex.items.length?"（还有"+(ex.items.length-done)+"空未选）":"");
s.className="score "+(ok>=9?"good":ok>=7?"mid":"poor");
}
renderFills();

/* 完形实战 */
function renderClozes(){
document.getElementById("clozeWrap").innerHTML=CLOZES.map(function(cz,ci){
var parts=cz.text.split(/\{\{(\d+)\}\}/);
var html="";
for(var i=0;i<parts.length;i++){
if(i%2===1){
var n=parseInt(parts[i])-1;
var opts='<option value="">（'+(n+1)+'）</option>'+cz.blanks[n].o.map(function(w){return '<option value="'+esc(w)+'">'+esc(w)+'</option>'}).join("");
html+='<select id="c'+ci+'_'+n+'">'+opts+'</select>';
}else html+=esc(parts[i]);
}
var expl=cz.blanks.map(function(b,n){
return '<div class="expline" id="ce'+ci+'_'+n+'" style="display:none"><b>'+(n+1)+'. </b>'+esc(b.e)+'</div>';
}).join("");
return '<div class="panel"><h2>'+esc(cz.t)+'</h2><div class="tip">'+esc(cz.tip)+'</div><div class="passage">'+html+'</div><button class="btn" onclick="checkCloze('+ci+')">检查答案</button><div class="score" id="cs_'+ci+'"></div><div id="ce_'+ci+'" style="margin-top:10px">'+expl+'</div></div>';
}).join("");
}
function checkCloze(ci){
var cz=CLOZES[ci],ok=0;
cz.blanks.forEach(function(b,n){
var sel=document.getElementById("c"+ci+"_"+n);
var v=sel.value;
sel.style.borderColor="";sel.style.color="";
document.getElementById("ce"+ci+"_"+n).style.display="none";
if(!v)return;
if(v===b.a){ok++;sel.style.borderColor="#2ba471";sel.style.color="#2ba471";}
else{
sel.style.borderColor="#d5483f";sel.style.color="#d5483f";
var e=document.getElementById("ce"+ci+"_"+n);
e.innerHTML='<b>'+(n+1)+". "+esc(b.a)+"</b>　"+esc(b.e);
e.style.display="block";
addWrong("完形"+(ci+1)+" 第"+(n+1)+"空",v,b.a,b.e);
}
});
var s=document.getElementById("cs_"+ci);
s.textContent="得分 "+ok+"/"+cz.blanks.length;
s.className="score "+(ok>=9?"good":ok>=7?"mid":"poor");
}
renderClozes();

/* 错题本 */
function renderWrong(){
var w=document.getElementById("wrongWrap");
if(!wrongs.length){w.innerHTML='<div class="empty">暂无错题——做完练习并检查答案后，错题会自动收进来。</div>';return;}
w.innerHTML='<div class="stat">共 '+wrongs.length+' 道错题</div>'+wrongs.map(function(x,i){
return '<div class="card wrong-card"><div class="qtext">'+esc(x.q)+'</div><p>你的答案：<span style="color:#d5483f;font-weight:600">'+esc(x.yours)+'</span>　正确答案：<span style="color:#2ba471;font-weight:600">'+esc(x.right)+'</span></p><div class="ex">'+esc(x.note)+'</div><button class="btn ghost" style="margin-top:8px;padding:5px 14px;font-size:13px" onclick="removeWrong('+i+')">移出错题本</button></div>';
}).join("")+'<button class="btn ghost" onclick="wrongs.length=0;saveWrongs();">清空错题本</button>';
}
updateWrongBadge();
</script>
</body>
</html>
