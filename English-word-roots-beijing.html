<html lang="zh-CN">

<title>高考英语·词根词缀（北京卷拓展版）</title>
<style>
:root{--blue:#1a73e8;--blue2:#0d47a1;--green:#2e7d32;--bg:#f5f7fb;--card:#fff;--ink:#1a2332;--grey:#6b7480;--line:#e3e8f0}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;padding-bottom:24px}
.topbar{position:fixed;left:0;right:0;top:0;z-index:100;background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;padding:14px 16px 12px;padding-top:calc(14px + env(safe-area-inset-top));transition:transform .25s;box-shadow:0 2px 10px rgba(26,115,232,.25)}
.topbar.hide{transform:translateY(-100%)}
.topbar h1{font-size:17px;font-weight:700;letter-spacing:.3px}
.topbar p{font-size:11px;opacity:.85;margin-top:2px}
.wrap{padding-top:96px}
.tabs{display:flex;gap:8px;padding:10px 14px;overflow-x:auto;background:var(--bg);position:sticky;top:0;z-index:90}
.tab{flex:0 0 auto;padding:7px 14px;border-radius:20px;background:var(--card);border:1px solid var(--line);font-size:13px;color:var(--grey);white-space:nowrap;cursor:pointer}
.tab.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.panel{display:none;padding:0 14px 20px}
.panel.on{display:block}
.progress{background:var(--card);border-radius:12px;padding:12px 14px;margin:10px 0;font-size:13px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.bar{height:7px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--blue2));width:0;transition:width .3s}
.list{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.card{background:var(--card);border-radius:14px;padding:16px;box-shadow:0 1px 5px rgba(0,0,0,.06);border:1px solid var(--line);perspective:800px;cursor:pointer;transition:transform .15s}
.card:active{transform:scale(.985)}
.card .front{font-size:16px;font-weight:700;color:var(--blue)}
.card .front small{display:block;font-size:12px;font-weight:400;color:var(--grey);margin-top:3px}
.card .back{display:none;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.card .back .m{font-size:15px;color:var(--green);font-weight:600}
.card .back .ex{font-size:12px;color:var(--grey);margin-top:6px;font-style:italic}
.card .flip-hint{text-align:right;font-size:11px;color:var(--blue);margin-top:8px}
.card.flipped .back{display:block}
.card.flipped .flip-hint{display:none}
.row{display:flex;gap:8px;align-items:center;margin:10px 0}
.btn{flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:13px;color:var(--ink);cursor:pointer}
.btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn.small{padding:6px 12px;font-size:12px;flex:0 0 auto}
.section-title{font-size:15px;font-weight:700;margin:16px 2px 8px;color:var(--ink)}
.chip{display:inline-block;background:#e8f0fe;color:var(--blue);border-radius:6px;padding:2px 8px;font-size:11px;margin:2px 4px 2px 0}
.q{background:var(--card);border-radius:14px;padding:16px;box-shadow:0 1px 5px rgba(0,0,0,.06);margin-bottom:12px}
.q .stem{font-size:15px;font-weight:600;margin-bottom:10px}
.q .stem .brk{display:block;font-size:12px;color:var(--blue);font-weight:400;margin-top:4px}
.q .opts{display:flex;flex-direction:column;gap:8px}
.q .opt{padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-size:14px;cursor:pointer;text-align:left}
.q .opt.right{border-color:var(--green);background:#e8f5e9;color:var(--green);font-weight:600}
.q .opt.wrong{border-color:#d32f2f;background:#ffebee;color:#d32f2f}
.score{background:var(--card);border-radius:14px;padding:20px;text-align:center;box-shadow:0 1px 5px rgba(0,0,0,.06)}
.score .num{font-size:40px;font-weight:800;color:var(--blue)}
.toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.8);background:rgba(26,35,50,.96);color:#fff;border-radius:14px;padding:18px 22px;font-size:14px;max-width:80%;text-align:center;z-index:999;opacity:0;pointer-events:none;transition:.2s;line-height:1.5}
.toast.on{opacity:1;transform:translate(-50%,-50%) scale(1);pointer-events:auto}
.toast .t-close{display:inline-block;margin-top:12px;padding:6px 20px;background:var(--blue);border-radius:20px;font-size:13px;cursor:pointer}
.adv-grid{display:flex;flex-direction:column;gap:10px}
.adv-item{background:var(--card);border-radius:12px;padding:13px 14px;border:1px solid var(--line)}
.adv-item .w{font-size:15px;font-weight:700;color:var(--blue2)}
.adv-item .brk{font-size:12px;color:var(--green);margin:4px 0}
.adv-item .src{font-size:11px;color:var(--grey)}
.empty{text-align:center;color:var(--grey);padding:40px 20px;font-size:14px}
@media(max-width:380px){.topbar h1{font-size:16px}}
</style>
</head>

// ===== 关键修复：动态测算抬头真实高度，给下方留安全间距 =====
function fitTopGap(){
  var tb=document.getElementById('topbar');
  var wrap=document.getElementById('wrap');
  if(!tb||!wrap)return;
  var h=tb.getBoundingClientRect().height; // 抬头真实渲染高度
  wrap.style.paddingTop=(h+8)+'px'; // +8px 安全间隙
}
window.addEventListener('load',fitTopGap);
window.addEventListener('resize',fitTopGap);
window.addEventListener('orientationchange',function(){setTimeout(fitTopGap,150)});
fitTopGap(); // 首帧立即执行

// 下滑收起抬头
var lastY=0;
window.addEventListener('scroll',function(){
  var y=window.scrollY;
  var tb=document.getElementById('topbar');
  if(!tb)return;
  if(y>60&&y>lastY){tb.classList.add('hide')}else{tb.classList.remove('hide')}
  lastY=y;
});

function switchPanel(id){
  document.querySelectorAll('.panel').forEach(function(p){p.classList.remove('on')});
  document.getElementById('panel-'+id).classList.add('on');
  document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('on')});
  // 重新校准间距（切换面板后高度可能变）
  setTimeout(fitTopGap,0);
}

// 渲染词根卡（事件委托，避免行内 onclick 兼容问题）
function renderCards(){
  var box=document.getElementById('cardList');
  box.innerHTML='';
  CARDS.forEach(function(c){
    var el=document.createElement('div');
    el.className='card'+(learned[c.id]?' flipped':'');
    el.dataset.id=c.id;
    el.innerHTML='<div class="front">'+c.front+'<small>'+c.ex+'</small></div>'+
                 '<div class="back"><div class="m">'+c.back+'</div>'+
                 (c.ex?'<div class="ex">'+c.ex+'</div>':'')+'</div>'+
                 (learned[c.id]?'':'<div class="flip-hint">点我翻转 ▾</div>');
    box.appendChild(el);
  });
  updateProgress();
}
// 事件委托：点卡片翻转
document.getElementById('cardList').addEventListener('click',function(ev){
  var card=ev.target.closest('.card');
  if(!card)return;
  var id=card.dataset.id;
  card.classList.toggle('flipped');
  if(card.classList.contains('flipped')){
    learned[id]=1;
    var c=CARDS.find(function(x){return x.id===id});
    if(c&&!card.querySelector('.flip-hint').style.display==='none'){
      // 首次翻转：标记已学，去掉提示
    }
    saveLearned();
    // 去掉翻转提示
    var hint=card.querySelector('.flip-hint');
    if(hint)hint.style.display='none';
    updateProgress();
  }
});
function updateProgress(){
  var n=Object.keys(learned).filter(function(k){return learned[k]}).length;
  document.getElementById('progText').textContent='已学 '+n+'/'+CARDS.length+'（'+(CARDS.length?Math.round(n/CARDS.length*100):0)+'%）';
  document.getElementById('progBar').style.width=(CARDS.length?n/CARDS.length*100:0)+'%';
}
document.getElementById('shuffleBtn').onclick=function(){
  for(var i=CARDS.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=CARDS[i];CARDS[i]=CARDS[j];CARDS[j]=t;}
  renderCards();
};
document.getElementById('resetBtn').onclick=function(){
  learned={};saveLearned();renderCards();
};

// 词根/前后缀列表
function renderList(el,arr,key){
  el.innerHTML='';
  arr.forEach(function(x){
    var d=document.createElement('div');
    d.className='card';
    var front=x.r||x.p||x.s;
    var ex=x.e||x.ex||'';
    d.innerHTML='<div class="front">'+front+'<small>'+ex+'</small></div>'+
                '<div class="back"><div class="m">'+x.m+'</div></div>';
    d.addEventListener('click',function(){d.classList.toggle('flipped')});
    el.appendChild(d);
  });
}
renderCards();
renderList(document.getElementById('rootList'),ROOTS);
renderList(document.getElementById('prefixList'),PREFIXES);
renderList(document.getElementById('suffixList'),SUFFIXES);

// 超纲词列表
function renderAdvanced(){
  var box=document.getElementById('advList');
  box.innerHTML='';
  ADVANCED.forEach(function(x){
    var d=document.createElement('div');
    d.className='adv-item';
    d.innerHTML='<div class="w">'+x.w+'</div><div class="brk">'+x.brk+'</div>'+
                '<div>'+x.m+' <span class="chip">大纲外 · '+x.src+'</span></div>';
    box.appendChild(d);
  });
}
renderAdvanced();

// ===== 练习专区（三题型）=====
var pracModes=[
  {id:'break',n:'🔧拆解（'+BREAK_Q.length+'）'},
  {id:'match',n:'🧩含义配对（'+MATCH_Q.length+'）'},
  {id:'adv',n:'🚀超纲推导（'+ADV_Q.length+'）'},
];
var curMode='break',pracIdx=0,pracScore=0,pracDone=0;
var pracTabsEl=document.getElementById('pracTabs');
pracModes.forEach(function(m){
  var b=document.createElement('button');
  b.className='tab'+(m.id==='break'?' on':'');
  b.textContent=m.n;
  b.onclick=function(){curMode=m.id;pracIdx=0;pracScore=0;pracDone=0;renderPracTabs();doPrac();};
  pracTabsEl.appendChild(b);
});
function renderPracTabs(){
  pracTabsEl.querySelectorAll('.tab').forEach(function(t,i){
    t.classList.toggle('on',pracModes[i].id===curMode);
  });
}
function curPool(){return curMode==='break'?BREAK_Q:curMode==='match'?MATCH_Q:ADV_Q;}
function doPrac(){
  var pool=curPool();
  var body=document.getElementById('pracBody');
  if(pracIdx>=pool.length){
    body.innerHTML='<div class="score"><div class="num">'+pracScore+' / '+pool.length+'</div>'+
      '<div style="color:var(--grey);margin:8px 0">正确率：'+(pool.length?Math.round(pracScore/pool.length*100):0)+'%</div>'+
      '<button class="btn primary" id="restartPrac">🔄 再来一组</button></div>';
    document.getElementById('restartPrac').onclick=function(){pracIdx=0;pracScore=0;pracDone=0;doPrac();};
    return;
  }
  var q=pool[pracIdx];
  var html='<div class="q"><div class="stem">'+q.w+(q.brk?'<span class="brk">'+q.brk+'</span>':'')+'</div><div class="opts">';
  q.opts.forEach(function(o,i){
    html+='<button class="opt" data-i="'+i+'">'+o+'</button>';
  });
  html+='</div></div>';
  body.innerHTML=html;
  var answered=false;
  body.querySelectorAll('.opt').forEach(function(btn){
    btn.addEventListener('click',function(){
      if(answered)return;answered=true;
      var i=+btn.dataset.i;
      if(i===q.ans){
        btn.classList.add('right');pracScore++;
      }else{
        btn.classList.add('wrong');
        var opts=body.querySelectorAll('.opt');
        if(opts[q.ans])opts[q.ans].classList.add('right');
        // 记录错词
        var key=curMode+':'+q.w;
        if(!wrongs.find(function(w){return w.key===key})){
          wrongs.push({key:key,w:q.w,brk:q.brk||'',m:q.opts[q.ans]});
          saveWrongs();
        }
      }
      pracDone++;
      setTimeout(function(){pracIdx++;doPrac();},500);
    });
  });
}
renderPracTabs();
doPrac();

// 错词本
function renderWrong(){
  var box=document.getElementById('wrongList');
  if(!wrongs.length){box.innerHTML='<div class="empty">🎉 还没有错题，继续加油！</div>';return;}
  box.innerHTML='';
  wrongs.forEach(function(w){
    var d=document.createElement('div');
    d.className='card';
    d.innerHTML='<div class="front">'+w.w+'<small>'+(w.brk||'')+'</small></div>'+
                '<div class="back"><div class="m">'+w.m+'</div></div>';
    d.addEventListener('click',function(){d.classList.toggle('flipped')});
    box.appendChild(d);
  });
}
document.getElementById('clearWrong').onclick=function(){wrongs=[];saveWrongs();renderWrong();};

// toast
function toast(msg){
  var t=document.getElementById('toast');
  t.innerHTML=msg+'<div class="t-close">我知道了</div>';
  t.classList.add('on');
  t.querySelector('.t-close').onclick=function(){t.classList.remove('on')};
}

// 首屏显示卡片面板
switchPanel('cards');
renderWrong();
</script>
</body>
</html>
