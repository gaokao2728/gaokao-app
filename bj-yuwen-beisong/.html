<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>高考语文背诵默写练习</title>
<style>
  :root {
    --primary: #4a6cf7;
    --primary-light: #eef2ff;
    --success: #10b981;
    --danger: #ef4444;
    --warning: #f59e0b;
    --gray-50: #f8fafc;
    --gray-100: #f1f5f9;
    --gray-200: #e2e8f0;
    --gray-300: #cbd5e1;
    --gray-500: #64748b;
    --gray-700: #334155;
    --gray-900: #0f172a;
    --radius: 12px;
    --shadow: 0 2px 12px rgba(0,0,0,.08);
    --shadow-lg: 0 8px 30px rgba(0,0,0,.12);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--gray-50);
    color: var(--gray-900);
    line-height: 1.6;
    min-height: 100vh;
  }

  /* ===== Header ===== */
  .header {
    background: linear-gradient(135deg, #4a6cf7 0%, #7c3aed 100%);
    color: #fff;
    padding: 20px 0 28px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: var(--shadow-lg);
  }
  .header-inner {
    max-width: 960px;
    margin: 0 auto;
    padding: 0 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
  }
  .header h1 { font-size: 20px; font-weight: 700; letter-spacing: .5px; }
  .header h1 .icon { margin-right: 6px; }
  .header-meta { font-size: 13px; opacity: .85; }
  .nav-tabs {
    display: flex;
    gap: 6px;
    margin-top: 10px;
    width: 100%;
    overflow-x: auto;
    padding-bottom: 2px;
  }
  .nav-tab {
    padding: 6px 14px;
    border-radius: 8px;
    font-size: 13px;
    cursor: pointer;
    background: rgba(255,255,255,.15);
    color: #fff;
    border: none;
    white-space: nowrap;
    transition: all .2s;
  }
  .nav-tab.active { background: #fff; color: var(--primary); font-weight: 600; }
  .nav-tab:hover:not(.active) { background: rgba(255,255,255,.25); }

  /* ===== Main ===== */
  .main {
    max-width: 960px;
    margin: 0 auto;
    padding: 20px 16px 80px;
  }

  /* ===== Stats Bar ===== */
  .stats-bar {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin-bottom: 20px;
  }
  .stat-card {
    background: #fff;
    border-radius: var(--radius);
    padding: 14px 10px;
    text-align: center;
    box-shadow: var(--shadow);
  }
  .stat-num { font-size: 24px; font-weight: 700; color: var(--primary); }
  .stat-label { font-size: 12px; color: var(--gray-500); margin-top: 2px; }

  /* ===== Filter Bar ===== */
  .filter-bar {
    background: #fff;
    border-radius: var(--radius);
    padding: 14px;
    margin-bottom: 18px;
    box-shadow: var(--shadow);
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }
  .filter-bar label { font-size: 13px; color: var(--gray-500); margin-right: 4px; }
  .chip {
    padding: 5px 12px;
    border-radius: 20px;
    font-size: 12px;
    cursor: pointer;
    border: 1px solid var(--gray-200);
    background: var(--gray-50);
    color: var(--gray-700);
    transition: all .2s;
    user-select: none;
  }
  .chip.active { background: var(--primary); color: #fff; border-color: var(--primary); }
  .chip:hover:not(.active) { border-color: var(--primary); color: var(--primary); }

  /* ===== Cards ===== */
  .card {
    background: #fff;
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: var(--shadow);
    transition: all .25s;
  }
  .card:hover { box-shadow: var(--shadow-lg); }

  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 12px;
    flex-wrap: wrap;
    gap: 8px;
  }
  .card-title { font-size: 16px; font-weight: 700; }
  .card-title .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 500;
    margin-left: 6px;
    vertical-align: middle;
  }
  .badge-wen { background: #ede9fe; color: #7c3aed; }
  .badge-shi { background: #dbeafe; color: #2563eb; }
  .badge-star { color: var(--warning); font-size: 13px; }

  /* ===== Question ===== */
  .question-context {
    background: var(--primary-light);
    border-left: 4px solid var(--primary);
    padding: 12px 14px;
    border-radius: 6px;
    font-size: 14px;
    color: var(--gray-700);
    margin-bottom: 14px;
    line-height: 1.8;
  }
  .question-context .hint-label {
    font-weight: 600;
    color: var(--primary);
    margin-right: 4px;
  }

  .answer-area { margin-bottom: 12px; }
  .answer-input {
    width: 100%;
    min-height: 80px;
    padding: 12px 14px;
    border: 2px solid var(--gray-200);
    border-radius: 8px;
    font-size: 15px;
    font-family: inherit;
    resize: vertical;
    transition: border-color .2s;
    line-height: 1.8;
  }
  .answer-input:focus { outline: none; border-color: var(--primary); }
  .answer-input.correct { border-color: var(--success); background: #f0fdf4; }
  .answer-input.wrong { border-color: var(--danger); background: #fef2f2; }

  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn {
    padding: 8px 18px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    border: none;
    transition: all .2s;
  }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover { background: #3a5ce5; }
  .btn-outline { background: #fff; color: var(--primary); border: 1px solid var(--primary); }
  .btn-outline:hover { background: var(--primary-light); }
  .btn-success { background: var(--success); color: #fff; }
  .btn-ghost { background: var(--gray-100); color: var(--gray-700); }
  .btn-ghost:hover { background: var(--gray-200); }

  /* ===== Result ===== */
  .result-box {
    margin-top: 14px;
    padding: 14px;
    border-radius: 8px;
    display: none;
    animation: fadeIn .3s;
  }
  .result-box.show { display: block; }
  .result-box.correct { background: #f0fdf4; border: 1px solid #bbf7d0; }
  .result-box.wrong { background: #fef2f2; border: 1px solid #fecaca; }
  .result-title { font-weight: 700; font-size: 15px; margin-bottom: 8px; }
  .result-title.ok { color: var(--success); }
  .result-title.bad { color: var(--danger); }
  .diff-line { font-size: 14px; line-height: 2; }
  .diff-correct { color: var(--success); font-weight: 600; }
  .diff-wrong { color: var(--danger); text-decoration: line-through; }
  .diff-missing { color: var(--danger); border-bottom: 2px solid var(--danger); padding: 0 2px; }

  /* ===== Flashcard Mode ===== */
  .flashcard {
    perspective: 1000px;
    max-width: 600px;
    margin: 0 auto 20px;
  }
  .flashcard-inner {
    position: relative;
    width: 100%;
    min-height: 220px;
    transform-style: preserve-3d;
    transition: transform .5s;
    cursor: pointer;
  }
  .flashcard-inner.flipped { transform: rotateY(180deg); }
  .flashcard-face {
    position: absolute;
    width: 100%;
    min-height: 220px;
    backface-visibility: hidden;
    border-radius: var(--radius);
    padding: 28px 24px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    box-shadow: var(--shadow-lg);
  }
  .flashcard-front {
    background: linear-gradient(135deg, #eef2ff, #faf5ff);
    border: 2px solid #c7d2fe;
  }
  .flashcard-back {
    background: linear-gradient(135deg, #f0fdf4, #ecfdf5);
    border: 2px solid #bbf7d0;
    transform: rotateY(180deg);
  }
  .flashcard-prompt { font-size: 13px; color: var(--gray-500); margin-bottom: 10px; }
  .flashcard-text { font-size: 18px; font-weight: 600; line-height: 1.8; }
  .flashcard-hint { font-size: 13px; color: var(--gray-500); margin-top: 14px; }
  .flashcard-nav { display: flex; gap: 10px; justify-content: center; margin-top: 16px; }

  /* ===== Progress ===== */
  .progress-section { margin-bottom: 20px; }
  .progress-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    background: #fff;
    border-radius: 8px;
    margin-bottom: 8px;
    box-shadow: var(--shadow);
  }
  .progress-name { flex: 1; font-size: 14px; font-weight: 500; }
  .progress-bar-bg {
    width: 120px;
    height: 8px;
    background: var(--gray-200);
    border-radius: 4px;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    border-radius: 4px;
    transition: width .4s;
  }
  .progress-count { font-size: 12px; color: var(--gray-500); min-width: 50px; text-align: right; }

  /* ===== Wrong Book ===== */
  .wrong-item {
    padding: 12px 14px;
    border: 1px solid var(--gray-200);
    border-radius: 8px;
    margin-bottom: 10px;
    background: #fef2f2;
  }
  .wrong-item .wrong-q { font-size: 13px; color: var(--gray-700); margin-bottom: 6px; }
  .wrong-item .wrong-a { font-size: 14px; color: var(--danger); }
  .wrong-item .wrong-correct { font-size: 14px; color: var(--success); font-weight: 600; }

  /* ===== Section Title ===== */
  .section-title {
    font-size: 16px;
    font-weight: 700;
    margin: 24px 0 12px;
    padding-left: 10px;
    border-left: 4px solid var(--primary);
  }

  /* ===== Empty State ===== */
  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--gray-500);
  }
  .empty-state .big-icon { font-size: 48px; margin-bottom: 12px; }

  /* ===== Toast ===== */
  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--gray-900);
    color: #fff;
    padding: 10px 24px;
    border-radius: 8px;
    font-size: 14px;
    opacity: 0;
    transition: all .3s;
    z-index: 999;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ===== Responsive ===== */
  @media (max-width: 640px) {
    .stats-bar { grid-template-columns: repeat(2, 1fr); }
    .header h1 { font-size: 17px; }
    .card { padding: 16px; }
    .flashcard-text { font-size: 16px; }
  }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>

<div class="header">
  <div class="header-inner">
    <div>
      <h1><span class="icon">📖</span>高考语文背诵默写练习</h1>

<div class="main">

      <span class="chip active" data-filter="all">全部</span>

    </div>
    <div id="practiceContainer"></div>
    <div class="btn-row" style="justify-content:center; margin-top:16px;">

  </div>

  <!-- Flashcard View -->

    <div class="filter-bar">

    </div>
    <div id="flashcardContainer"></div>
  </div>

  <!-- Wrong Book View -->

    <div class="section-title">我的错题库</div>
    <div id="wrongBookContainer"></div>
  </div>

  <!-- Progress View -->
  <div class="view" id="view-progress" style="display:none;">
    <div class="section-title">篇目掌握进度</div>
    <div id="progressContainer"></div>
  </div>

  <!-- Directory View -->
  <div class="view" id="view-directory" style="display:none;">
    <div class="section-title">50篇总览（点击篇名快速练习）</div>
    <div id="directoryContainer"></div>
  </div>

</div>

<div class="toast" id="toast"></div>

/* ============================================================
   应用状态 & 工具函数
   ============================================================ */
const STATE = {
  view: 'practice',
  filter: 'all',
  currentQ: null,
  fcMode: 'prompt',
  fcIndex: 0,
  wrongList: JSON.parse(localStorage.getItem('gk_wrong') || '[]'),
  correctCount: parseInt(localStorage.getItem('gk_correct') || '0'),
  totalCount: parseInt(localStorage.getItem('gk_total') || '0'),
  streak: parseInt(localStorage.getItem('gk_streak') || '0'),
  bestStreak: parseInt(localStorage.getItem('gk_bestStreak') || '0'),
  pianmuProgress: JSON.parse(localStorage.getItem('gk_pmProg') || '{}'),
};

function saveState() {
  localStorage.setItem('gk_wrong', JSON.stringify(STATE.wrongList));
  localStorage.setItem('gk_correct', STATE.correctCount);
  localStorage.setItem('gk_total', STATE.totalCount);
  localStorage.setItem('gk_streak', STATE.streak);
  localStorage.setItem('gk_bestStreak', STATE.bestStreak);
  localStorage.setItem('gk_pmProg', JSON.stringify(STATE.pianmuProgress));
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1800);
}

function getPianmu(id) { return PIANMU.find(p => p.id === id); }

function starStr(n) { return '★'.repeat(n) + '☆'.repeat(5 - n); }

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

/* ============================================================
   导航切换
   ============================================================ */
document.getElementById('navTabs').addEventListener('click', e => {
  if (!e.target.classList.contains('nav-tab')) return;
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
  e.target.classList.add('active');
  const v = e.target.dataset.view;
  STATE.view = v;
  document.querySelectorAll('.view').forEach(el => el.style.display = 'none');
  document.getElementById('view-' + v).style.display = '';
  render();
});

/* ============================================================
   筛选
   ============================================================ */
document.getElementById('filterBar').addEventListener('click', e => {
  if (!e.target.classList.contains('chip')) return;
  document.querySelectorAll('#filterBar .chip').forEach(c => c.classList.remove('active'));
  e.target.classList.add('active');
  STATE.filter = e.target.dataset.filter;
  render();
});

document.querySelectorAll('.filter-bar [data-fcmode]').forEach(el => {
  el.addEventListener('click', e => {
    document.querySelectorAll('.filter-bar [data-fcmode]').forEach(c => c.classList.remove('active'));
    e.target.classList.add('active');
    STATE.fcMode = e.target.dataset.fcmode;
    render();
  });
});

/* ============================================================
   渲染入口
   ============================================================ */
function render() {
  renderStats();
  if (STATE.view === 'practice') renderPractice();
  else if (STATE.view === 'flashcard') renderFlashcard();
  else if (STATE.view === 'wrongbook') renderWrongBook();
  else if (STATE.view === 'progress') renderProgress();
  else if (STATE.view === 'directory') renderDirectory();
}

function renderStats() {
  const acc = STATE.totalCount ? Math.round(STATE.correctCount / STATE.totalCount * 100) : 0;
  const html = `
    <div class="stat-card"><div class="stat-num">${STATE.totalCount}</div><div class="stat-label">已做题</div></div>
    <div class="stat-card"><div class="stat-num" style="color:var(--success)">${STATE.correctCount}</div><div class="stat-label">答对</div></div>
    <div class="stat-card"><div class="stat-num" style="color:var(--primary)">${acc}%</div><div class="stat-label">正确率</div></div>
    <div class="stat-card"><div class="stat-num" style="color:var(--warning)">${STATE.bestStreak}</div><div class="stat-label">最长连对</div></div>
  `;
  document.getElementById('statsBar').innerHTML = html;
}

/* ============================================================
   情境默写练习
   ============================================================ */
function getFilteredQuestions() {
  let list = QUESTIONS.slice();
  const f = STATE.filter;
  if (f === 'wen') list = list.filter(q => getPianmu(q.pid).cat === 'wen');
  else if (f === 'shi') list = list.filter(q => getPianmu(q.pid).cat === 'shi');
  else if (f === 'star5') list = list.filter(q => getPianmu(q.pid).star === 5);
  else if (f === 'star4') list = list.filter(q => getPianmu(q.pid).star === 4);
  else if (f === 'star3') list = list.filter(q => getPianmu(q.pid).star === 3);
  else if (f === 'wrong') {
    const wids = new Set(STATE.wrongList.map(w => w.qid));
    list = list.filter(q => wids.has(QUESTIONS.indexOf(q)));
  }
  return list;
}

function pickRandomQuestion() {
  const list = getFilteredQuestions();
  if (!list.length) return null;
  return list[Math.floor(Math.random() * list.length)];
}

function renderPractice() {
  const container = document.getElementById('practiceContainer');
  if (!STATE.currentQ) STATE.currentQ = pickRandomQuestion();
  const q = STATE.currentQ;
  if (!q) {
    container.innerHTML = `<div class="empty-state"><div class="big-icon">🎉</div>当前筛选下没有题目，换个筛选试试！</div>`;
    return;
  }
  const pm = getPianmu(q.pid);
  const blanksHtml = q.ans.map((_, i) => `
    <div style="margin-bottom:10px;">
      <div style="font-size:13px;color:var(--gray-500);margin-bottom:4px;">第${i+1}空</div>
      <textarea class="answer-input" data-idx="${i}" placeholder="在此输入第${i+1}空的答案…" rows="2"></textarea>
    </div>
  `).join('');

  container.innerHTML = `
    <div class="card">
      <div class="card-header">
        <div class="card-title">
          ${escHtml(pm.name)}
          <span class="badge ${pm.cat==='wen'?'badge-wen':'badge-shi'}">${pm.cat==='wen'?'文言文':'诗词曲'}</span>
          <span class="badge" style="background:var(--gray-100);color:var(--gray-700);">${pm.ce}</span>
        </div>
        <div class="card-title badge-star">${starStr(pm.star)}</div>
      </div>
      <div class="question-context">
        <span class="hint-label">📝 情境提示：</span><br>${escHtml(q.ctx)}
      </div>
      <div class="answer-area">${blanksHtml}</div>
      <div class="btn-row">
        <button class="btn btn-primary" id="btnCheck">✔ 检查答案</button>
        <button class="btn btn-outline" id="btnShow">👁 显示答案</button>
        <button class="btn btn-ghost" id="btnClear">�✗ 清空</button>
      </div>
      <div class="result-box" id="resultBox"></div>
    </div>
  `;

  // 自动聚焦第一个输入框
  const firstInput = container.querySelector('.answer-input');
  if (firstInput) {
    firstInput.focus();
    // 回车切到下一个
    container.querySelectorAll('.answer-input').forEach((ta, i, all) => {
      ta.addEventListener('keydown', e => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          if (i < all.length - 1) all[i+1].focus();
          else document.getElementById('btnCheck').click();
        }
      });
    });
  }

  document.getElementById('btnCheck').addEventListener('click', () => checkAnswer());
  document.getElementById('btnShow').addEventListener('click', () => showAnswer());
  document.getElementById('btnClear').addEventListener('click', () => {
    container.querySelectorAll('.answer-input').forEach(ta => ta.value = '');
    container.querySelector('.result-box').classList.remove('show');
    container.querySelectorAll('.answer-input').forEach(ta => {
      ta.classList.remove('correct','wrong');
    });
    firstInput.focus();
  });
}

function normalize(s) {
  return s.trim()
    .replace(/[\s　]+/g, '')
    .replace(/[，。！？、；：""''（）—…\-\.\,\!\?\;\:\"\'\(\)]/g, '');
}

function checkAnswer() {
  const q = STATE.currentQ;
  const inputs = document.querySelectorAll('.answer-input');
  let allCorrect = true;
  let results = [];
  inputs.forEach((ta, i) => {
    const userAns = normalize(ta.value);
    const correctAns = normalize(q.ans[i]);
    if (userAns === correctAns) {
      ta.classList.add('correct');
      ta.classList.remove('wrong');
      results.push({ ok: true, user: ta.value, correct: q.ans[i] });
    } else {
      ta.classList.add('wrong');
      ta.classList.remove('correct');
      allCorrect = false;
      results.push({ ok: false, user: ta.value, correct: q.ans[i] });
    }
  });

  STATE.totalCount++;
  const box = document.getElementById('resultBox');
  if (allCorrect) {
    STATE.correctCount++;
    STATE.streak++;
    if (STATE.streak > STATE.bestStreak) STATE.bestStreak = STATE.streak;
    box.className = 'result-box show correct';
    box.innerHTML = `<div class="result-title ok">✅ 全部正确！连对 ${STATE.streak} 题 🔥</div>`;
    showToast('答对了！+1');
    // 从错题本移除
    const qid = QUESTIONS.indexOf(q);
    STATE.wrongList = STATE.wrongList.filter(w => w.qid !== qid);
    // 更新篇目进度
    const prog = STATE.pianmuProgress[q.pid] || { correct:0, total:0 };
    prog.correct++; prog.total++;
    STATE.pianmuProgress[q.pid] = prog;
  } else {
    STATE.streak = 0;
    box.className = 'result-box show wrong';
    let html = `<div class="result-title bad">❌ 有错误，请看正确答案：</div><div class="diff-line">`;
    results.forEach((r, i) => {
      html += `<div style="margin-bottom:6px;"><b>第${i+1}空：</b>`;
      if (r.ok) {
        html += `<span class="diff-correct">${escHtml(r.correct)}</span> ✓`;
      } else {
        html += `<span class="diff-wrong">${escHtml(r.user)||'(空)'}</span> → <span class="diff-correct">${escHtml(r.correct)}</span>`;
      }
      html += `</div>`;
    });
    html += `</div>`;
    box.innerHTML = html;
    showToast('有错误，已加入错题库');
    // 加入错题本
    const qid = QUESTIONS.indexOf(q);
    if (!STATE.wrongList.find(w => w.qid === qid)) {
      STATE.wrongList.push({ qid, pid: q.pid, ctx: q.ctx, ans: q.ans, ts: Date.now() });
    }
    const prog = STATE.pianmuProgress[q.pid] || { correct:0, total:0 };
    prog.total++;
    STATE.pianmuProgress[q.pid] = prog;
  }
  saveState();
  renderStats();
}

function showAnswer() {
  const q = STATE.currentQ;
  const inputs = document.querySelectorAll('.answer-input');
  inputs.forEach((ta, i) => {
    ta.value = q.ans[i];
    ta.classList.add('correct');
    ta.classList.remove('wrong');
  });
  const box = document.getElementById('resultBox');
  box.className = 'result-box show correct';
  box.innerHTML = `<div class="result-title ok">💡 已显示正确答案，试着背一遍再做题</div>`;
}

document.getElementById('btnNext').addEventListener('click', () => {

document.getElementById('btnRandom').addEventListener('click', () => {

});

function renderFlashcard() {
  const container = document.getElementById('flashcardContainer');
  const list = QUESTIONS.slice();
  if (!list.length) return;
  const q = list[STATE.fcIndex % list.length];
  const pm = getPianmu(q.pid);
  const isPrompt = STATE.fcMode === 'prompt';
  const frontText = isPrompt ? escHtml(q.ctx) : q.ans.map((a,i)=>`<b>第${i+1}空：</b>${escHtml(a)}`).join('<br>');
  const backText = isPrompt ? q.ans.map((a,i)=>`<b>第${i+1}空：</b>${escHtml(a)}`).join('<br>') : escHtml(q.ctx);

  container.innerHTML = `
    <div class="flashcard">
      <div class="flashcard-inner" id="fcInner">
        <div class="flashcard-face flashcard-front">
          <div class="flashcard-prompt">${isPrompt?'📝 情境提示（点击翻转看答案）':'📖 正确答案（点击翻转看提示）'}</div>
          <div class="flashcard-text">${frontText}</div>
          <div class="flashcard-hint">${escHtml(pm.name)} · ${pm.ce}</div>
        </div>
        <div class="flashcard-face flashcard-back">
          <div class="flashcard-prompt">✅ 答案</div>
          <div class="flashcard-text">${backText}</div>
          <div class="flashcard-hint">${escHtml(pm.name)} · ${pm.ce}</div>
        </div>
      </div>
    </div>
    <div class="flashcard-nav">
      <button class="btn btn-ghost" id="fcPrev">← 上一张</button>
      <button class="btn btn-primary" id="fcFlip">🔄 翻转</button>
      <button class="btn btn-ghost" id="fcNext">下一张 →</button>
    </div>
    <div style="text-align:center;font-size:12px;color:var(--gray-500);margin-top:6px;">
      第 ${STATE.fcIndex % list.length + 1} / ${list.length} 题
    </div>
  `;
  const inner = document.getElementById('fcInner');
  inner.addEventListener('click', () => inner.classList.toggle('flipped'));
  document.getElementById('fcFlip').addEventListener('click', () => inner.classList.toggle('flipped'));
  document.getElementById('fcPrev').addEventListener('click', () => { STATE.fcIndex--; render(); });
  document.getElementById('fcNext').addEventListener('click', () => { STATE.fcIndex++; render(); });
}

function renderWrongBook() {
  const container = document.getElementById('wrongBookContainer');
  if (!STATE.wrongList.length) {
    container.innerHTML = `<div class="empty-state"><div class="big-icon">🎊</div>暂无错题，继续加油！</div>`;
    return;
  }
  // 按篇目分组
  const grouped = {};
  STATE.wrongList.forEach((w, idx) => {
    if (!grouped[w.pid]) grouped[w.pid] = [];
    grouped[w.pid].push({ ...w, idx });
  });
  let html = '';
  Object.keys(grouped).forEach(pid => {
    const pm = getPianmu(parseInt(pid));
    html += `<div style="margin-bottom:18px;">
      <div class="card-title" style="margin-bottom:8px;">
        ${escHtml(pm.name)}
        <span class="badge ${pm.cat==='wen'?'badge-wen':'badge-shi'}">${pm.cat==='wen'?'文言文':'诗词曲'}</span>
        <span style="font-size:12px;color:var(--gray-500);">（${grouped[pid].length}题）</span>
      </div>`;
    grouped[pid].forEach(w => {
      html += `<div class="wrong-item">
        <div class="wrong-q"><b>提示：</b>${escHtml(w.ctx)}</div>
        <div class="wrong-correct"><b>答案：</b>${w.ans.map((a,i)=>`第${i+1}空：${escHtml(a)}`).join('；')}</div>
        <div style="margin-top:6px;">
          <button class="btn btn-outline btn-sm" data-remove="${w.idx}" style="padding:3px 10px;font-size:12px;">移除</button>
        </div>
      </div>`;
    });
    html += `</div>`;
  });
  container.innerHTML = html;
  container.querySelectorAll('[data-remove]').forEach(btn => {
    btn.addEventListener('click', () => {
      const idx = parseInt(btn.dataset.remove);
      STATE.wrongList.splice(idx, 1);
      saveState();
      render();
      showToast('已从错题库移除');
    });
  });
}

/* ============================================================
   学习进度
   ============================================================ */
function renderProgress() {
  const container = document.getElementById('progressContainer');
  // 按册数分组
  const groups = {
    '必修上': PIANMU.filter(p => p.ce === '必修上'),
    '必修下': PIANMU.filter(p => p.ce === '必修下'),
    '选必上': PIANMU.filter(p => p.ce === '选必上'),
    '选必中': PIANMU.filter(p => p.ce === '选必中'),
    '选必下': PIANMU.filter(p => p.ce === '选必下'),
  };
  let html = '';
  Object.keys(groups).forEach(ce => {
    const items = groups[ce];
    if (!items.length) return;
    html += `<div style="margin-bottom:18px;"><div class="card-title" style="margin-bottom:10px;">📚 ${ce}（${items.length}篇）</div>`;
    items.forEach(pm => {
      const prog = STATE.pianmuProgress[pm.id] || { correct:0, total:0 };
      const pct = prog.total ? Math.round(prog.correct / prog.total * 100) : 0;
      const barColor = pct >= 80 ? 'var(--success)' : pct >= 50 ? 'var(--primary)' : 'var(--warning)';
      html += `<div class="progress-item">
        <div class="progress-name">${escHtml(pm.name)} ${starStr(pm.star).replace(/★/g,'<span style="color:var(--warning)">★</span>').replace(/☆/g,'<span style="color:var(--gray-300)">☆</span>')}</div>
        <div class="progress-bar-bg"><div class="progress-bar-fill" style="width:${pct}%;background:${barColor}"></div></div>
        <div class="progress-count">${prog.correct}/${prog.total} (${pct}%)</div>
      </div>`;
    });
    html += `</div>`;
  });
  container.innerHTML = html;
}

/* ============================================================
   篇目总览
   ============================================================ */
function renderDirectory() {
  const container = document.getElementById('directoryContainer');
  const groups = {
    '文言文': PIANMU.filter(p => p.cat === 'wen'),
    '诗词曲': PIANMU.filter(p => p.cat === 'shi'),
  };
  let html = '';
  Object.keys(groups).forEach(cat => {
    const items = groups[cat];
    html += `<div style="margin-bottom:18px;"><div class="card-title" style="margin-bottom:10px;">${cat}（${items.length}篇）</div><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px;">`;
    items.forEach(pm => {
      const prog = STATE.pianmuProgress[pm.id] || { correct:0, total:0 };
      const pct = prog.total ? Math.round(prog.correct / prog.total * 100) : 0;
      html += `<div class="card" style="padding:12px 14px;cursor:pointer;" data-pid="${pm.id}">
        <div style="font-weight:600;font-size:14px;margin-bottom:4px;">${escHtml(pm.name)}</div>
        <div style="font-size:12px;color:var(--gray-500);">${pm.ce} · ${starStr(pm.star)} · 进度 ${pct}%</div>
      </div>`;
    });
    html += `</div></div>`;
  });
  container.innerHTML = html;
  container.querySelectorAll('[data-pid]').forEach(card => {
    card.addEventListener('click', () => {
      const pid = parseInt(card.dataset.pid);
      STATE.filter = 'all';
      document.querySelectorAll('#filterBar .chip').forEach(c => c.classList.remove('active'));
      document.querySelector('#filterBar .chip[data-filter="all"]').classList.add('active');
      // 找该篇目第一题
      const q = QUESTIONS.find(qq => qq.pid === pid);
      if (q) {
        STATE.currentQ = q;
        // 切到练习视图
        document.querySelector('.nav-tab[data-view="practice"]').click();
      }
    });
  });
}

/* ============================================================
   初始化
   ============================================================ */
render();
</script>
</body>
</html>
