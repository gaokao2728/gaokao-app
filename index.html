<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#4f46e5">
<title>高考英语小工具合集</title>
<style>
  :root{
    --primary:#4f46e5; --primary-dark:#4338ca; --accent:#f59e0b;
    --bg:#f6f7fb; --card:#fff; --text:#1f2937; --muted:#6b7280; --line:#eef0f4;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--text);font-size:16px;line-height:1.6;
    -webkit-user-select:none;user-select:none;overscroll-behavior-y:contain;
  }
  .wrap{max-width:820px;margin:0 auto;padding:0 0 80px;}
  header{
    background:linear-gradient(135deg,var(--primary),var(--primary-dark));
    color:#fff;padding:30px 18px 22px;text-align:center;
    border-radius:0 0 24px 24px;box-shadow:0 4px 14px rgba(79,70,229,.25);
  }
  header .emoji{font-size:40px;margin-bottom:6px;}
  header h1{font-size:21px;margin:0 0 6px;font-weight:900;letter-spacing:.5px;}
  header p{font-size:13px;margin:0;opacity:.9;}
  .container{padding:18px 16px;}
  .sec-title{font-size:15px;font-weight:800;color:var(--primary);margin:4px 4px 12px;
    display:flex;align-items:center;gap:6px;}
  .grid{display:flex;flex-direction:column;gap:14px;}
  a.card{display:block;text-decoration:none;color:inherit;background:var(--card);
    border-radius:18px;padding:18px;box-shadow:0 2px 12px rgba(0,0,0,.05);
    border:1px solid var(--line);transition:transform .15s,box-shadow .15s;position:relative;overflow:hidden;}
  a.card:active{transform:scale(.98);box-shadow:0 1px 6px rgba(0,0,0,.06);}
  a.card .top{display:flex;align-items:center;gap:12px;margin-bottom:8px;}
  a.card .icon{font-size:30px;width:46px;height:46px;border-radius:14px;
    background:#eef0ff;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  a.card h3{font-size:16px;margin:0 0 2px;font-weight:800;color:var(--text);}
  a.card .tag{font-size:11px;color:var(--primary);background:#eef0ff;
    padding:2px 8px;border-radius:10px;font-weight:600;}
  a.card p.desc{font-size:13px;color:var(--muted);margin:6px 0 12px;line-height:1.55;}
  a.card .meta{display:flex;gap:8px;flex-wrap:wrap;}
  a.card .chip{font-size:11px;color:var(--muted);background:var(--bg);
    border:1px solid var(--line);padding:3px 9px;border-radius:10px;}
  a.card .arrow{position:absolute;right:18px;top:50%;transform:translateY(-50%);
    font-size:20px;color:#c7cae6;}
  .coming{opacity:.6;}
  .tip{font-size:12px;color:var(--muted);text-align:center;margin-top:18px;line-height:1.7;}
  .toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.9);
    background:rgba(31,41,55,.92);color:#fff;font-size:14px;padding:10px 20px;
    border-radius:12px;z-index:999;opacity:0;pointer-events:none;transition:.2s;white-space:nowrap;}
  .toast.show{opacity:1;transform:translate(-50%,-50%) scale(1);}
  footer{text-align:center;font-size:11px;color:#b7bcc8;margin-top:24px;padding:0 16px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="emoji">📚</div>
    <h1>高考英语小工具合集</h1>
    <p>2016–2026 真题规律 · 手机直接刷 · 无需下载</p>
  </header>

  <div class="container">
    <div class="sec-title">🧰 全部工具</div>
    <div class="grid" id="grid"><!-- 卡片由 JS 渲染 --></div>
    <div class="tip">点击卡片直接进入对应小工具<br>后续新工具会自动出现在这里</div>
  </div>

  <footer>本合集由 GitHub Pages 托管 · 数据与练习均在本地运行</footer>
</div>
<div class="toast" id="toast"></div>

<script>
var APPS = [
  {
    href:'transition-words/',
    icon:'📘', title:'高考英语转折词通关宝典',
    tag:'已上线', desc:'41 个转折词 · 23 条真题例句（含北京卷）· 10 道闯关练习 · 六大解题技巧',
    chips:['but / however 每年必考','nevertheless 北京卷偏爱','转折后=答案所在']
  }
  // 以后新增小程序，按下面格式复制一条即可：
  // ,{ href:'cloze-words/', icon:'📗', title:'完形填空高频词', tag:'敬请期待',
  //    desc:'...', chips:['...','...','...'], coming:true }
];

function toast(m){var t=document.getElementById('toast');t.innerText=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},2200);}

var grid=document.getElementById('grid');
APPS.forEach(function(a){
  var card=document.createElement('a');
  card.className='card'+(a.coming?' coming':'');
  card.href=a.coming?'javascript:void(0)':'transition-words/'===a.href?a.href:'../'+a.href;
  if(a.coming){card.addEventListener('click',function(e){e.preventDefault();toast('即将上线，敬请期待');});}
  var top=document.createElement('div');top.className='top';
  top.innerHTML='<div class="icon">'+a.icon+'</div><div><h3>'+a.title+'</h3><span class="tag">'+(a.coming?'即将上线':'进入')+'</span></div>';
  var p=document.createElement('p');p.className='desc';p.innerText=a.desc;
  var meta=document.createElement('div');meta.className='meta';
  (a.chips||[]).forEach(function(c){var s=document.createElement('span');s.className='chip';s.innerText=c;meta.appendChild(s);});
  var arrow=document.createElement('div');arrow.className='arrow';arrow.innerText='›';
  card.appendChild(top);card.appendChild(p);card.appendChild(meta);card.appendChild(arrow);
  grid.appendChild(card);
});
</script>
</body>
</html>
