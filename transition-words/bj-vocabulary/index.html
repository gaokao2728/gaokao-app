<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>北京高考英语高频词汇宝典 2021-2026</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  :root {
    --primary:#4A6CF7; --primary-light:#EEF2FF;
    --bg:#F8FAFC; --card:#FFFFFF;
    --text:#1E293B; --text2:#64748B; --border:#E2E8F0;
    --green:#10B981; --orange:#F59E0B; --red:#EF4444; --purple:#7C3AED;
    --radius:14px; --shadow:0 1px 6px rgba(0,0,0,0.06);
  }
  body {
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',sans-serif;
    background:var(--bg); color:var(--text); overflow-x:hidden; padding-bottom:90px;
  }

  /* ===== 顶部 ===== */
  .topbar {
    background:linear-gradient(135deg,#4A6CF7 0%,#7C3AED 100%);
    color:#fff; padding:18px 16px 22px; position:sticky; top:0; z-index:100;
    box-shadow:0 4px 16px rgba(74,108,247,0.25);
  }
  .topbar h1 { font-size:18px; font-weight:800; display:flex; align-items:center; gap:8px; }
  .topbar h1 .ico { font-size:22px; }
  .topbar .sub { font-size:12px; opacity:0.85; margin-top:3px; }
  .stats { display:flex; gap:8px; margin-top:12px; }
  .stat {
    flex:1; background:rgba(255,255,255,0.18); border-radius:10px; padding:8px 6px; text-align:center;
    backdrop-filter:blur(6px);
  }
  .stat b { font-size:18px; display:block; }
  .stat span { font-size:10px; opacity:0.85; }

  /* ===== 搜索 ===== */
  .search-wrap { margin:-12px 14px 10px; position:relative; z-index:10; }
  .search-box {
    background:#fff; border-radius:12px; padding:10px 14px; display:flex; align-items:center; gap:8px;
    box-shadow:0 4px 16px rgba(0,0,0,0.1); border:2px solid transparent; transition:border .2s;
  }
  .search-box:focus-within { border-color:var(--primary); }
  .search-box input { flex:1; border:none; outline:none; font-size:15px; color:var(--text); background:transparent; }
  .search-box input::placeholder { color:#94A3B8; }
  .search-ico { font-size:16px; color:var(--primary); }

  /* ===== 筛选标签 ===== */
  .filters { padding:0 14px 8px; }
  .filter-row { display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; scrollbar-width:none; }
  .filter-row::-webkit-scrollbar { display:none; }
  .chip {
    padding:6px 14px; border-radius:20px; font-size:12px; font-weight:600; white-space:nowrap;
    background:#fff; color:var(--text2); border:1.5px solid var(--border); cursor:pointer; user-select:none;
    transition:all .2s;
  }
  .chip.active { background:var(--primary); color:#fff; border-color:var(--primary); }

  /* ===== 分组标题 ===== */
  .group-title {
    padding:10px 16px 6px; font-size:14px; font-weight:700; color:var(--text);
    display:flex; align-items:center; gap:6px;
  }
  .group-title .dot { width:6px; height:6px; border-radius:50%; background:var(--primary); }
  .group-title .cnt { font-size:12px; font-weight:500; color:var(--text2); margin-left:4px; }

  /* ===== 单词卡片 ===== */
  .word-list { padding:0 12px; }
  .word-item {
    background:var(--card); border-radius:var(--radius); padding:12px 14px; margin-bottom:8px;
    box-shadow:var(--shadow); border:1px solid var(--border); cursor:pointer;
    transition:transform .15s, box-shadow .15s;
  }
  .word-item:active { transform:scale(0.98); }
  .word-item.expanded { box-shadow:0 4px 20px rgba(74,108,247,0.12); border-color:#C7D2FE; }
  .word-row1 { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .word-eng { font-size:18px; font-weight:800; color:var(--text); }
  .word-pos { font-size:11px; font-weight:600; color:var(--primary); background:var(--primary-light); padding:2px 8px; border-radius:5px; }
  .word-freq { font-size:11px; font-weight:700; padding:2px 8px; border-radius:5px; }
  .word-freq.top { background:#FEF3C7; color:#D97706; }
  .word-freq.high { background:#DBEAFE; color:#2563EB; }
  .word-cat { font-size:11px; padding:2px 8px; border-radius:5px; font-weight:600; }
  .word-cat.verb { background:#DCFCE7; color:#16A34A; }
  .word-cat.noun { background:#EDE9FE; color:#7C3AED; }
  .word-cat.adj  { background:#FCE7F3; color:#DB2777; }
  .word-cat.adv  { background:#FFEDD5; color:#C2410C; }
  .word-cat.conj { background:#E0F2FE; color:#0284C7; }
  .word-meaning { font-size:14px; color:var(--text2); margin-top:4px; line-height:1.5; }
  .stars { font-size:12px; margin-left:auto; letter-spacing:1px; }
  .stars.s5 { color:#F59E0B; }
  .stars.s4 { color:#94A3B8; }

  /* 展开详情 */
  .word-detail { display:none; margin-top:10px; padding-top:10px; border-top:1px dashed var(--border); }
  .word-item.expanded .word-detail { display:block; }
  .wd-line { font-size:13px; line-height:1.7; margin-bottom:6px; }
  .wd-line b { color:var(--primary); font-weight:600; }
  .wd-ex { background:#F8FAFF; border-left:3px solid var(--primary); padding:8px 10px; border-radius:0 8px 8px 0; font-size:12.5px; color:#475569; font-style:italic; margin:6px 0; line-height:1.6; }
  .wd-extra { background:#FFFBEB; border:1px solid #FDE68A; border-radius:8px; padding:8px 10px; font-size:12px; color:#92400E; line-height:1.6; margin-top:6px; }
  .wd-years { display:flex; gap:4px; flex-wrap:wrap; margin-top:6px; }
  .wd-year-tag { font-size:10px; background:#F1F5F9; color:#64748B; padding:2px 7px; border-radius:4px; font-weight:600; }

  /* ===== 底部导航 ===== */
  .bottom-nav {
    position:fixed; bottom:0; left:0; right:0; z-index:100;
    background:#fff; border-top:1px solid var(--border); display:flex;
    padding:6px 4px max(6px,env(safe-area-inset-bottom));
    box-shadow:0 -2px 12px rgba(0,0,0,0.06);
  }
  .nav-btn {
    flex:1; display:flex; flex-direction:column; align-items:center; gap:2px;
    padding:6px 4px; cursor:pointer; user-select:none; border:none; background:transparent;
    color:var(--text2); font-size:11px; font-weight:500; transition:color .2s;
  }
  .nav-btn .nav-ico { font-size:20px; }
  .nav-btn.active { color:var(--primary); font-weight:700; }

  /* ===== 闪卡 ===== */
  .page { display:none; }
  .page.active { display:block; }
  .flashcard-area { padding:0 14px; }
  .fc-card {
    background:linear-gradient(135deg,#fff 0%,#F8FAFF 100%); border-radius:var(--radius);
    padding:24px 20px; min-height:200px; display:flex; flex-direction:column;
    justify-content:center; align-items:center; text-align:center;
    box-shadow:0 8px 30px rgba(0,0,0,0.1); border:1px solid var(--border);
    cursor:pointer; position:relative; overflow:hidden;
  }
  .fc-card::before { content:''; position:absolute; top:0;left:0;right:0; height:4px; background:linear-gradient(90deg,var(--primary),var(--purple)); }
  .fc-word { font-size:26px; font-weight:800; margin-bottom:4px; }
  .fc-phonetic { font-size:14px; color:var(--primary); margin-bottom:10px; font-family:'Times New Roman',serif; }
  .fc-pos-tag { font-size:12px; background:var(--primary-light); color:var(--primary); padding:3px 10px; border-radius:6px; margin-bottom:10px; font-weight:600; }
  .fc-meaning { font-size:16px; line-height:1.6; margin-bottom:8px; }
  .fc-extra { font-size:12px; color:var(--text2); margin-top:8px; line-height:1.5; }
  .fc-btns { display:flex; gap:10px; margin-top:14px; width:100%; }
  .fc-btn { flex:1; padding:10px; border-radius:10px; font-size:13px; font-weight:700; border:none; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:4px; user-select:none; }
  .fc-btn:active { transform:scale(0.96); }
  .fc-btn-know { background:#ECFDF5; color:var(--green); border:1.5px solid #A7F3D0; }
  .fc-btn-dont { background:#FEF2F2; color:var(--red); border:1.5px solid #FECACA; }
  .fc-btn-star { background:#FFFBEB; color:var(--orange); border:1.5px solid #FDE68A; }
  .fc-progress { font-size:12px; color:var(--text2); margin-top:8px; }

  /* ===== 刷题 ===== */
  .quiz-area { padding:0 14px; }
  .quiz-card { background:var(--card); border-radius:var(--radius); padding:18px; margin-bottom:12px; box-shadow:var(--shadow); border:1px solid var(--border); }
  .quiz-q { font-size:16px; font-weight:700; margin-bottom:14px; }
  .quiz-q .qword { color:var(--primary); }
  .quiz-opts { display:flex; flex-direction:column; gap:8px; }
  .quiz-opt {
    padding:12px 14px; border-radius:10px; border:2px solid var(--border); font-size:14px;
    cursor:pointer; transition:all .2s; user-select:none; background:#fff;
  }
  .quiz-opt:active { transform:scale(0.98); }
  .quiz-opt.correct { border-color:var(--green); background:#ECFDF5; color:var(--green); font-weight:700; }
  .quiz-opt.wrong { border-color:var(--red); background:#FEF2F2; color:var(--red); font-weight:700; }
  .quiz-opt.disabled { opacity:0.6; cursor:default; }
  .quiz-feedback { font-size:13px; margin-top:10px; padding:10px; border-radius:8px; line-height:1.6; }
  .quiz-feedback.ok { background:#ECFDF5; color:#065F46; }
  .quiz-feedback.bad { background:#FEF2F2; color:#991B1B; }
  .quiz-next { margin-top:12px; width:100%; padding:12px; border-radius:10px; border:none; background:var(--primary); color:#fff; font-size:15px; font-weight:700; cursor:pointer; }
  .quiz-next:active { transform:scale(0.98); }
  .quiz-score { text-align:center; font-size:15px; margin-bottom:12px; color:var(--text2); }
  .quiz-score b { color:var(--primary); font-size:20px; }

  /* ===== 收藏 ===== */
  .fav-empty { text-align:center; padding:40px 20px; color:var(--text2); font-size:14px; }
  .fav-empty .big { font-size:40px; margin-bottom:10px; }

  /* ===== 空状态 ===== */
  .empty-state { text-align:center; padding:40px 20px; color:var(--text2); }
  .empty-state .big { font-size:36px; margin-bottom:8px; }

  /* ===== 统计面板 ===== */
  .stats-panel { padding:0 14px 10px; }
  .stats-grid { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
  .stat-card { background:var(--card); border-radius:12px; padding:12px 8px; text-align:center; box-shadow:var(--shadow); border:1px solid var(--border); }
  .stat-card b { font-size:20px; display:block; }
  .stat-card span { font-size:11px; color:var(--text2); }
  .stat-card.green b { color:var(--green); }
  .stat-card.blue b { color:var(--primary); }
  .stat-card.purple b { color:var(--purple); }
  .stat-card.orange b { color:var(--orange); }

  /* 回到顶部 */
  .back-top {
    position:fixed; right:16px; bottom:80px; width:42px; height:42px; border-radius:50%;
    background:var(--primary); color:#fff; border:none; font-size:20px; cursor:pointer;
    box-shadow:0 4px 12px rgba(74,108,247,0.4); display:none; z-index:99;
    align-items:center; justify-content:center;
  }
  .back-top.show { display:flex; }
</style>
</head>
<body>

<!-- ===== 顶部 ===== -->
<div class="topbar">
  <h1><span class="ico">📚</span> 北京高考英语词汇宝典</h1>
  <div class="sub">2021—2026 近5年高频词汇 · 共 <span id="totalCount">0</span> 词</div>
  <div class="stats">
    <div class="stat"><b id="sTop">0</b><span>★★★★★ 必背</span></div>
    <div class="stat"><b id="sHigh">0</b><span>★★★★ 重点</span></div>
    <div class="stat"><b id="sVerb">0</b><span>动词</span></div>
    <div class="stat"><b id="sNoun">0</b><span>名词</span></div>
  </div>
</div>

<!-- ===== 搜索 ===== -->
<div class="search-wrap">
  <div class="search-box">
    <span class="search-ico">🔍</span>
    <input id="searchInput" type="text" placeholder="搜索英文单词 / 中文释义 / 例句...">
  </div>
</div>

<!-- ===== 筛选 ===== -->
<div class="filters">
  <div class="filter-row" id="filterRow">
    <div class="chip active" data-filter="all">全部</div>
    <div class="chip" data-filter="top">★★★★★ 必背</div>
    <div class="chip" data-filter="high">★★★★ 重点</div>
    <div class="chip" data-filter="verb">动词</div>
    <div class="chip" data-filter="noun">名词</div>
    <div class="chip" data-filter="adj">形容词</div>
    <div class="chip" data-filter="adv">副词</div>
    <div class="chip" data-filter="conj">连词</div>
  </div>
</div>

<!-- ===== 页面容器 ===== -->
<div id="pageList" class="page active">
  <!-- 统计面板 -->
  <div class="stats-panel">
    <div class="stats-grid">
      <div class="stat-card blue"><b id="cTotal">0</b><span>总词汇</span></div>
      <div class="stat-card orange"><b id="cTop">0</b><span>★★★★★</span></div>
      <div class="stat-card green"><b id="cHigh">0</b><span>★★★★</span></div>
    </div>
  </div>

  <!-- 单词列表 -->
  <div class="group-title" id="listTitle"><span class="dot"></span> 全部词汇 <span class="cnt" id="listCnt"></span></div>
  <div class="word-list" id="wordList"></div>
  <div class="empty-state" id="emptyState" style="display:none;">
    <div class="big">🔎</div>
    没有找到匹配的单词<br><small>试试别的关键词吧</small>
  </div>
</div>

<!-- ===== 闪卡页 ===== -->
<div id="pageCard" class="page">
  <div class="flashcard-area">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
      <div style="font-size:13px;color:var(--text2);" id="fcIndex">— / —</div>
      <div style="font-size:12px;color:var(--text2);" id="fcQueue">待复习: 0</div>
    </div>
    <div class="fc-card" id="fcCard" onclick="flipCard()">
      <div class="fc-word" id="fcWord"></div>
      <div class="fc-phonetic" id="fcPhonetic"></div>
      <div class="fc-pos-tag" id="fcPos"></div>
      <div class="fc-meaning" id="fcMeaning" style="display:none;"></div>
      <div class="fc-extra" id="fcExtra" style="display:none;"></div>
      <div style="font-size:12px;color:#94A3B8;margin-top:10px;" id="fcHint">👆 点击卡片翻转查看释义</div>
    </div>
    <div class="fc-btns">
      <button class="fc-btn fc-btn-know" onclick="event.stopPropagation();cardAction('know')">✅ 认识</button>
      <button class="fc-btn fc-btn-dont" onclick="event.stopPropagation();cardAction('dont')">❌ 不认识</button>
      <button class="fc-btn fc-btn-star" onclick="event.stopPropagation();cardAction('star')">⭐ 收藏</button>
    </div>
    <div class="fc-progress" id="fcProgress"></div>
  </div>
</div>

<!-- ===== 刷题页 ===== -->
<div id="pageQuiz" class="page">
  <div class="quiz-area">
    <div class="quiz-score" id="quizScore">第 <b id="qNum">1</b> 题 · 正确 <b id="qCorrect">0</b> / <b id="qTotal">0</b></div>
    <div class="quiz-card" id="quizCard">
      <div class="quiz-q" id="quizQ"></div>
      <div class="quiz-opts" id="quizOpts"></div>
      <div class="quiz-feedback" id="quizFB" style="display:none;"></div>
      <button class="quiz-next" id="quizNext" style="display:none;" onclick="nextQuestion()">下一题 ➜</button>
    </div>
  </div>
</div>

<!-- ===== 收藏页 ===== -->
<div id="pageFav" class="page">
  <div class="fav-empty" id="favEmpty">
    <div class="big">⭐</div>
    还没有收藏单词<br><small>在单词详情页或闪卡中点 ⭐ 即可收藏</small>
  </div>
  <div class="word-list" id="favList"></div>
</div>

<!-- ===== 底部导航 ===== -->
<nav class="bottom-nav">
  <button class="nav-btn active" data-page="pageList" onclick="switchPage('pageList',this)">
    <span class="nav-ico">📖</span>词库
  </button>
  <button class="nav-btn" data-page="pageCard" onclick="switchPage('pageCard',this)">
    <span class="nav-ico">🃏</span>闪卡
  </button>
  <button class="nav-btn" data-page="pageQuiz" onclick="switchPage('pageQuiz',this)">
    <span class="nav-ico">🎯</span>刷题
  </button>
  <button class="nav-btn" data-page="pageFav" onclick="switchPage('pageFav',this)">
    <span class="nav-ico">⭐</span>收藏
  </button>
</nav>

<button class="back-top" id="backTop" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>

<script>
// ===== 全部词汇数据 =====
const VOCAB = [
  // ★★★★★ 必背
  {w:"develop",p:"/dɪˈveləp/",pos:"v.",m:"发展；形成；养成",f:6,cat:"verb",y:[2021,2022,2023,2024,2025,2026],e:"Reading develops your critical thinking skills.",x:"熟义：发展。生义：养成（习惯）、形成（观点）"},
  {w:"experience",p:"/ɪkˈspɪəriəns/",pos:"n./v.",m:"经验；经历；体验",f:6,cat:"noun",y:[2021,2022,2023,2024,2025,2026],e:"It was an unforgettable experience for me.",x:"作动词：体验。作名词：经验（不可数）/经历（可数）"},
  {w:"support",p:"/səˈpɔːt/",pos:"v./n.",m:"支持；支撑；供养",f:6,cat:"verb",y:[2021,2022,2023,2024,2025,2026],e:"My family always supports my decisions.",x:"熟义：支持。生义：支撑（物理上）、供养（家庭）"},
  {w:"global",p:"/ˈɡləʊbl/",pos:"adj.",m:"全球的；整体的",f:6,cat:"adj",y:[2021,2022,2023,2024,2025,2026],e:"Global warming is a serious issue.",x:"globe→global→globalization"},
  {w:"community",p:"/kəˈmjuːnəti/",pos:"n.",m:"社区；群体；共同体",f:6,cat:"noun",y:[2021,2022,2023,2024,2025,2026],e:"The local community benefited from the project.",x:"community service 社区服务"},
  {w:"opportunity",p:"/ˌɒpəˈtjuːnəti/",pos:"n.",m:"机会；时机",f:6,cat:"noun",y:[2021,2022,2023,2024,2025,2026],e:"This is a great opportunity to learn.",x:"= chance（更正式）。opportunity to do sth."},
  {w:"positive",p:"/ˈpɒzətɪv/",pos:"adj.",m:"积极的；正面的",f:6,cat:"adj",y:[2021,2022,2023,2024,2025,2026],e:"She has a positive attitude towards life.",x:"反义词：negative。positive effect 积极效果"},
  {w:"climate",p:"/ˈklaɪmət/",pos:"n.",m:"气候",f:6,cat:"noun",y:[2021,2023,2024,2025,2026],e:"The climate is changing rapidly.",x:"climate change 气候变化"},
  {w:"change",p:"/tʃeɪndʒ/",pos:"n./v.",m:"变化；改变",f:6,cat:"noun",y:[2021,2022,2023,2024,2025,2026],e:"Climate change affects everyone.",x:"changeable (adj.) 多变的"},
  {w:"threaten",p:"/ˈθretn/",pos:"v.",m:"威胁；恐吓",f:5,cat:"verb",y:[2020,2021,2024,2025,2026],e:"The storm threatened to destroy the crops.",x:"threat (n.) 威胁"},
  {w:"essential",p:"/ɪˈsenʃl/",pos:"adj.",m:"必要的；本质的",f:5,cat:"adj",y:[2020,2022,2023,2024,2026],e:"Water is essential for all living things.",x:"be essential for/to 对…至关重要"},

  // ★★★★ 重点 - 2026完形
  {w:"admiration",p:"/ˌædməˈreɪʃn/",pos:"n.",m:"赞赏；钦佩",f:4,cat:"noun",y:[2024,2025,2026],e:"I have great admiration for her courage.",x:"admire (v.) 钦佩"},
  {w:"avoid",p:"/əˈvɔɪd/",pos:"v.",m:"回避；避免",f:3,cat:"verb",y:[2024,2025,2026],e:"She started avoiding Mia after the competition.",x:"avoid doing sth."},
  {w:"distant",p:"/ˈdɪstənt/",pos:"adj.",m:"疏远的；遥远的",f:3,cat:"adj",y:[2024,2025,2026],e:"Mia noticed Ivy seemed distant lately.",x:"distance (n.) 距离"},

// ===== 全局状态 =====
let currentFilter = 'all';
let searchQuery = '';
let favorites = JSON.parse(localStorage.getItem('vocab_favs') || '[]');
let fcIndex = 0;
let fcFlipped = false;
let fcQueue = [];
let quizQuestions = [];
let quizCurrent = 0;
let quizCorrect = 0;

// ===== 初始化 =====
function init() {
  document.getElementById('totalCount').textContent = VOCAB.length;
  document.getElementById('sTop').textContent = VOCAB.filter(v=>v.f>=5).length;
  document.getElementById('sHigh').textContent = VOCAB.filter(v=>v.f>=3&&v.f<5).length;
  document.getElementById('sVerb').textContent = VOCAB.filter(v=>v.cat==='verb').length;
  document.getElementById('sNoun').textContent = VOCAB.filter(v=>v.cat==='noun').length;
  document.getElementById('cTotal').textContent = VOCAB.length;
  document.getElementById('cTop').textContent = VOCAB.filter(v=>v.f>=5).length;
  document.getElementById('cHigh').textContent = VOCAB.filter(v=>v.f>=3&&v.f<5).length;

  renderList();
  setupSearch();
  setupFilters();
  window.addEventListener('scroll', () => {
    document.getElementById('backTop').classList.toggle('show', window.scrollY > 300);
  });
}

// ===== 渲染单词列表 =====
function renderList() {
  const list = document.getElementById('wordList');
  const title = document.getElementById('listTitle');
  const cnt = document.getElementById('listCnt');
  const empty = document.getElementById('emptyState');

  let filtered = VOCAB.slice();

  // 筛选
  if (currentFilter === 'top') filtered = filtered.filter(v => v.f >= 5);
  else if (currentFilter === 'high') filtered = filtered.filter(v => v.f >= 3 && v.f < 5);
  else if (['verb','noun','adj','adv','conj'].includes(currentFilter)) filtered = filtered.filter(v => v.cat === currentFilter);

  // 搜索
  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    filtered = filtered.filter(v =>
      v.w.toLowerCase().includes(q) ||
      v.m.includes(searchQuery) ||
      (v.e && v.e.toLowerCase().includes(q)) ||
      (v.x && v.x.toLowerCase().includes(q))
    );
  }

  // 排序：先按频次降序，再按字母
  filtered.sort((a, b) => b.f - a.f || a.w.localeCompare(b.w));

  if (filtered.length === 0) {
    list.innerHTML = '';
    empty.style.display = 'block';
    cnt.textContent = '';
    title.style.display = 'none';
    return;
  }
  empty.style.display = 'none';
  title.style.display = 'flex';
  cnt.textContent = `共 ${filtered.length} 词`;

  // 分组渲染
  const topWords = filtered.filter(v => v.f >= 5);
  const highWords = filtered.filter(v => v.f < 5);

  let html = '';
  if (topWords.length > 0) {
    html += `<div class="group-title"><span class="dot" style="background:#F59E0B;"></span> ★★★★★ 必背词汇 <span class="cnt">${topWords.length}词</span></div>`;
    topWords.forEach(v => html += wordHTML(v));
  }
  if (highWords.length > 0 && currentFilter !== 'top') {
    html += `<div class="group-title"><span class="dot" style="background:#3B82F6;"></span> ★★★★ 重点词汇 <span class="cnt">${highWords.length}词</span></div>`;
    highWords.forEach(v => html += wordHTML(v));
  }

  list.innerHTML = html;

  // 绑定展开事件
  list.querySelectorAll('.word-item').forEach(el => {
    el.addEventListener('click', () => el.classList.toggle('expanded'));
  });
}

function wordHTML(v) {
  const starLvl = v.f >= 5 ? 's5' : 's4';
  const stars = v.f >= 5 ? '★★★★★' : '★★★★☆';
  const freqClass = v.f >= 5 ? 'top' : 'high';
  const catLabel = {verb:'动词',noun:'名词',adj:'形容词',adv:'副词',conj:'连词'}[v.cat]||v.cat;
  const favStar = favorites.includes(v.w) ? '⭐' : '☆';
  const yearTags = v.y.map(y => `<span class="wd-year-tag">${y}</span>`).join('');
  return `
  <div class="word-item" data-w="${v.w}">
    <div class="word-row1">
      <span class="word-eng">${v.w}</span>
      <span class="word-pos">${v.pos}</span>
      <span class="word-cat ${v.cat}">${catLabel}</span>
      <span class="stars ${starLvl}">${stars}</span>
      <span style="margin-left:auto;cursor:pointer;font-size:18px;color:#F59E0B;" onclick="event.stopPropagation();toggleFav('${v.w}')">${favStar}</span>
    </div>
    <div class="word-meaning">${v.m}</div>
    <div class="word-detail">
      <div class="wd-line"><b>音标：</b><span style="font-family:'Times New Roman',serif;color:var(--primary);">${v.p}</span></div>
      <div class="wd-ex">"${v.e}"</div>
      <div class="wd-extra">💡 ${v.x}</div>
      <div class="wd-line" style="margin-top:6px;"><b>出现年份：</b></div>
      <div class="wd-years">${yearTags}</div>
    </div>
  </div>`;
}

// ===== 搜索 =====
function setupSearch() {
  const inp = document.getElementById('searchInput');
  inp.addEventListener('input', () => {
    searchQuery = inp.value.trim();
    renderList();
  });
}

// ===== 筛选 =====
function setupFilters() {
  document.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click', () => {
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      currentFilter = chip.dataset.filter;
      renderList();
    });
  });
}

// ===== 收藏 =====
function toggleFav(word) {
  if (favorites.includes(word)) {
    favorites = favorites.filter(w => w !== word);
  } else {
    favorites.push(word);
  }
  localStorage.setItem('vocab_favs', JSON.stringify(favorites));
  renderList();
  if (document.getElementById('pageFav').classList.contains('active')) renderFavs();
}

function renderFavs() {
  const list = document.getElementById('favList');
  const empty = document.getElementById('favEmpty');
  if (favorites.length === 0) { list.innerHTML=''; empty.style.display='block'; return; }
  empty.style.display = 'none';
  const words = VOCAB.filter(v => favorites.includes(v.w));
  list.innerHTML = words.map(v => wordHTML(v)).join('');
  list.querySelectorAll('.word-item').forEach(el => {
    el.addEventListener('click', () => el.classList.toggle('expanded'));
  });
}

// ===== 页面切换 =====
function switchPage(pageId, btn) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById(pageId).classList.add('active');
  btn.classList.add('active');
  if (pageId === 'pageFav') renderFavs();
  if (pageId === 'pageCard') initFlashcard();
  if (pageId === 'pageQuiz') initQuiz();
  window.scrollTo({top:0,behavior:'smooth'});
}

// ===== 闪卡 =====
function initFlashcard() {
  fcQueue = [...VOCAB].sort(() => Math.random() - 0.5);
  fcIndex = 0;
  fcFlipped = false;
  showCard();
}

function showCard() {
  if (fcIndex >= fcQueue.length) { initFlashcard(); return; }
  const v = fcQueue[fcIndex];
  document.getElementById('fcWord').textContent = v.w;
  document.getElementById('fcPhonetic').textContent = v.p;
  document.getElementById('fcPos').textContent = v.pos;
  document.getElementById('fcMeaning').textContent = v.m;
  document.getElementById('fcExtra').innerHTML = `<b style="color:var(--primary);">例句：</b>"${v.e}"<br><b style="color:#92400E;">拓展：</b>${v.x}`;
  document.getElementById('fcMeaning').style.display = 'none';
  document.getElementById('fcExtra').style.display = 'none';
  document.getElementById('fcHint').style.display = 'block';
  document.getElementById('fcIndex').textContent = `${fcIndex+1} / ${fcQueue.length}`;
  document.getElementById('fcQueue').textContent = `待复习: ${fcQueue.length - fcIndex - 1}`;
  document.getElementById('fcProgress').textContent = `已收藏: ${favorites.length} 词`;
  fcFlipped = false;
}

function flipCard() {
  fcFlipped = !fcFlipped;
  document.getElementById('fcMeaning').style.display = fcFlipped ? 'block' : 'none';
  document.getElementById('fcExtra').style.display = fcFlipped ? 'block' : 'none';
  document.getElementById('fcHint').style.display = fcFlipped ? 'none' : 'block';
}

function cardAction(act) {
  const v = fcQueue[fcIndex];
  if (act === 'star') {
    toggleFav(v.w);
    return;
  }
  if (act === 'dont') {
    // 不认识的词移到队列后面
    fcQueue.push(fcQueue.splice(fcIndex, 1)[0]);
  }
  fcIndex++;
  if (fcIndex >= fcQueue.length) fcIndex = 0;
  fcFlipped = false;
  showCard();
}

// ===== 刷题 =====
function initQuiz() {
  quizCurrent = 0;
  quizCorrect = 0;
  generateQuestions();
  showQuestion();
}

function generateQuestions() {
  const pool = [...VOCAB].sort(() => Math.random() - 0.5).slice(0, 30);
  quizQuestions = pool.map(v => {
    // 生成选项：正确答案 + 3个干扰项
    const others = VOCAB.filter(x => x.w !== v.w).sort(() => Math.random() - 0.5).slice(0, 3);
    const opts = [v, ...others].sort(() => Math.random() - 0.5);
    return { word: v.w, correct: v.m, options: opts.map(o => o.m) };
  }).slice(0, 10);
}

function showQuestion() {
  if (quizCurrent >= quizQuestions.length) {
    // 结束
    document.getElementById('quizQ').innerHTML = `🎉 刷题完成！<br><small style="font-size:13px;color:var(--text2);">正确率：${quizCorrect}/${quizQuestions.length} (${Math.round(quizCorrect/quizQuestions.length*100)}%)</small>`;
    document.getElementById('quizOpts').innerHTML = `<button class="quiz-next" onclick="initQuiz()">🔄 再来一轮</button>`;
    document.getElementById('quizFB').style.display = 'none';
    document.getElementById('quizNext').style.display = 'none';
    return;
  }
  const q = quizQuestions[quizCurrent];
  document.getElementById('qNum').textContent = quizCurrent + 1;
  document.getElementById('qCorrect').textContent = quizCorrect;
  document.getElementById('qTotal').textContent = quizQuestions.length;
  document.getElementById('quizQ').innerHTML = `单词 <span class="qword">${q.word}</span> 的中文意思是？`;
  document.getElementById('quizOpts').innerHTML = q.options.map((opt, i) =>
    `<div class="quiz-opt" data-i="${i}" onclick="checkAnswer(this,${i},'${q.correct.replace(/'/g,"\\'")}')">${String.fromCharCode(65+i)}. ${opt}</div>`
  ).join('');
  document.getElementById('quizFB').style.display = 'none';
  document.getElementById('quizNext').style.display = 'none';
}

function checkAnswer(el, i, correct) {
  const opts = document.querySelectorAll('.quiz-opt');
  opts.forEach(o => o.classList.add('disabled'));
  const q = quizQuestions[quizCurrent];
  const fb = document.getElementById('quizFB');
  if (q.options[i] === correct) {
    el.classList.add('correct');
    fb.className = 'quiz-feedback ok';
    fb.textContent = '✅ 正确！' + q.word + ' = ' + correct;
    quizCorrect++;
  } else {
    el.classList.add('wrong');
    // 高亮正确答案
    opts.forEach(o => { if (o.textContent.includes(correct)) o.classList.add('correct'); });
    fb.className = 'quiz-feedback bad';
    fb.textContent = '❌ 正确答案：' + correct;
  }
  fb.style.display = 'block';
  document.getElementById('quizNext').style.display = 'block';
}

function nextQuestion() {
  quizCurrent++;
  showQuestion();
}

// ===== 启动 =====
init();
</script>

</html>
